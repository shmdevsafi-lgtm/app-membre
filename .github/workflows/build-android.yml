name: Build Android APK (Portail Membre)

# Triggered manually or on pushes to ai_main_fd88f290a6c54596ad0d. Produces a debug APK you can
# install directly (ParamÃ¨tres > SÃ©curitÃ© > Sources inconnues sur Android)
# without needing a Play Store listing or a signing key.
on:
  workflow_dispatch:
  push:
    branches: [ai_main_3ada1b77b7b24622a38d]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` here on purpose: package.json already pins pnpm via
        # "packageManager": "pnpm@10.14.0+...". Specifying both makes the
        # action fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets for the APK
        # VITE_API_BASE_URL must point at the deployed Netlify site: the
        # packaged app has no local backend, every /api/* call needs the
        # full URL (see client/lib/api-config.ts).
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BADGE_ENCRYPTION_KEY: ${{ secrets.VITE_BADGE_ENCRYPTION_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:apk-web

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Add Android platform
        # /android is gitignored and generated fresh every run so the repo
        # never has to carry the Gradle project around.
        run: npx cap add android

      - name: Add camera permission to AndroidManifest
        # The QR attendance scanner uses the web getUserMedia() camera API
        # (via the qr-scanner library) inside the Capacitor WebView. Without
        # the CAMERA permission declared in the manifest, Android never even
        # shows a permission prompt -- there is nothing to "allow" in
        # Settings because the app never asked for the capability. This
        # regenerates every run since /android is not committed to the repo.
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.CAMERA" android/app/src/main/AndroidManifest.xml && echo "Camera permission added successfully" || (echo "Failed to inject camera permission" && exit 1)

      - name: Generate Android app icon
        # Reads resources/icon.png (1024x1024) and writes every required
        # mipmap resolution into android/app/src/main/res/. No Android
        # Studio needed. If resources/icon.png doesn't exist yet, this step
        # just leaves the default Capacitor icon untouched.
        run: |
          if [ -f resources/icon.png ]; then
            npx @capacitor/assets generate --android
          else
            echo "resources/icon.png not found, skipping icon generation."
          fi

      - name: Remove unused google-services classpath
        # The stock Capacitor Android template declares
        # com.google.gms:google-services by default (for future Firebase/push
        # notification support), even though we never apply it (no
        # google-services.json, no @capacitor/push-notifications in this
        # app). Gradle still tries to resolve it and its transitive
        # dependencies (jsr305, kotlin-stdlib-jdk8) during configuration,
        # which currently fails with "403 Forbidden" from Maven Central on
        # GitHub-hosted runners (a known, widely-reported flakiness). Since
        # we don't need it, just remove the line instead of fighting it.
        run: sed -i "/classpath 'com.google.gms:google-services/d" android/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: portail-membre-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # ---------------------------------------------------------------------
  # OPTIONAL: signed release build.
  # Only runs if you've added the four secrets below in
  # Settings > Secrets and variables > Actions. Safe to ignore/delete this
  # job until you're ready for a Play Store / distributable release build.
  #
  # Required secrets:
  #   ANDROID_KEYSTORE_BASE64   (base64 of your .jks/.keystore file)
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  # ---------------------------------------------------------------------
  build-apk-release:
    runs-on: ubuntu-latest
    # NOTE: the `secrets` context cannot be used in a job-level `if:` â€”
    # GitHub Actions only exposes it inside steps. So this job always
    # starts, and its first step decides (via a step output) whether the
    # rest of the job should actually run.
    steps:
      - name: Check signing secrets are present
        id: check-secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: steps.check-secrets.outputs.skip == 'false'
        # No `version:` here on purpose: package.json already pins pnpm via
        # "packageManager": "pnpm@10.14.0+...". Specifying both makes the
        # action fail with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.check-secrets.outputs.skip == 'false'
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets for the APK
        if: steps.check-secrets.outputs.skip == 'false'
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_BADGE_ENCRYPTION_KEY: ${{ secrets.VITE_BADGE_ENCRYPTION_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm build:apk-web

      - name: Setup JDK 17
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Add Android platform
        if: steps.check-secrets.outputs.skip == 'false'
        run: npx cap add android

      - name: Add camera permission to AndroidManifest
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml

      - name: Generate Android app icon
        if: steps.check-secrets.outputs.skip == 'false'
        run: |
          if [ -f resources/icon.png ]; then
            npx @capacitor/assets generate --android
          else
            echo "resources/icon.png not found, skipping icon generation."
          fi

      - name: Remove unused google-services classpath
        if: steps.check-secrets.outputs.skip == 'false'
        run: sed -i "/classpath 'com.google.gms:google-services/d" android/build.gradle

      - name: Sync Capacitor
        if: steps.check-secrets.outputs.skip == 'false'
        run: npx cap sync android

      - name: Decode keystore
        if: steps.check-secrets.outputs.skip == 'false'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Grant execute permission to gradlew
        if: steps.check-secrets.outputs.skip == 'false'
        run: chmod +x android/gradlew

      - name: Build signed release APK
        if: steps.check-secrets.outputs.skip == 'false'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=app/release.keystore \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"

      - name: Upload signed APK artifact
        if: steps.check-secrets.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: portail-membre-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
