# Netlify Configuration for Scoutisme Hassania Safi
# This file configures the build, deployment, and redirect rules for Netlify

[build]
  # Build command - only the client build is needed;
  # Netlify bundles netlify/functions/api.ts itself with esbuild.
  command = "pnpm build:client"

  # Directory containing the built SPA assets
  publish = "dist/spa"

  # Source folder for Netlify Functions (Netlify bundles this itself,
  # same as the working "Qada" portal - no separate server build step)
  functions = "netlify/functions"

  # Node version for the build
  node_version = "20.x"

# Environment variables
[build.environment]
  # These can be overridden in Netlify UI
  NODE_ENV = "production"

# Functions configuration
[functions]
  # esbuild is recommended for faster builds
  node_bundler = "esbuild"
  external_node_modules = ["express"]

# Login / inscription : fonctions Netlify natives (v2), qui reçoivent
# une vraie requête standard (immunisées contre le bug de corps JSON
# corrompu du pont serverless-http). Doivent être AVANT le /api/*
# général ci-dessous, sinon celui-ci intercepte tout en premier.
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/save-documents"
  to = "/.netlify/functions/auth-save-documents"
  status = 200
  force = true

[[redirects]]
  from = "/api/send-email"
  to = "/.netlify/functions/send-email"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-pin"
  to = "/.netlify/functions/verify-pin"
  status = 200
  force = true

# API redirects - Routes Express API calls to Netlify Functions
# MUST come before the SPA catch-all below, otherwise /api/* requests
# get served index.html instead of hitting the function.
[[redirects]]
  from = "/api/auth/request-password-reset"
  to = "/.netlify/functions/auth-request-password-reset"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/reset-password"
  to = "/.netlify/functions/auth-reset-password"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Rewrite rules for single-page app (SPA)
# This ensures React Router works correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache control for static assets
[[headers]]
  for = "/*.{js,css,svg,woff2,png,jpg,jpeg,gif}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache control for index.html (should not be cached)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Success message
[build.processing]
  text-compression = true
